# Configuration du projet BiLSTM Filtré
# Conforme aux spécifications du cours de Master M2I (Pr. A. Mazroui)

model:
  embed_dim: 128
  hidden_dim: 128       # 128 par direction -> 256 en sortie concaténée
  dropout: 0.3
  bidirectional: true

training:
  batch_size: 32
  epochs: 10
  lr: 0.001
  grad_clip: 1.0
  seed: 42
  device: "cuda"        # bascule automatique vers "cpu" si CUDA indisponible

data:
  max_seq_len: 57       # Longueur max de référence
  pad_token: "<PAD>"
  unk_token: "<UNK>"
  pad_lemma: "<PAD>"
  unk_lemma: "<UNK>"
  pad_token_id: 0
  unk_token_id: 1
  pad_lemma_id: 0
  unk_lemma_id: 1

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  artifacts_dir: "artifacts"
  checkpoints_dir: "checkpoints"
  reports_dir: "reports"
